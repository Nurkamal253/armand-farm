<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login Admin - Armand Farm</title>

  <link
    rel="stylesheet"
    href="login.css"
  >

</head>


<body>


  <main class="login-container">


    <div class="login-card">


      <div class="login-logo">

        🥚

      </div>


      <h1>

        Armand Farm

      </h1>


      <p class="login-subtitle">

        Login Admin

      </p>


      <form id="login-form">


        <label for="email">

          Email

        </label>


        <input

          type="email"

          id="email"

          placeholder="Masukkan email admin"

          required

        >


        <label for="password">

          Password

        </label>


        <input

          type="password"

          id="password"

          placeholder="Masukkan password"

          required

        >


        <p
          id="error-message"
          class="error-message"
        ></p>


        <button
          type="submit"
          id="login-button"
        >

          🔐 Login

        </button>


      </form>


      <a
        href="../frontend/index.html"
        class="back-button"
      >

        ← Kembali ke Toko

      </a>


    </div>


  </main>


  <script src="login.js"></script>


</body>

</html>
