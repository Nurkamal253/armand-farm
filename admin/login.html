<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login Admin - Armand Farm</title>

  <link
    rel="stylesheet"
    href="login.css"
  >

</head>

<body>

  <main class="login-page">

    <!-- BAGIAN KIRI -->

    <section class="login-visual">

      <div class="visual-content">

        <div class="logo">

          <span class="egg-logo">
          </span>

          <div>

            <h1>
              Armand<span>Farm</span>
            </h1>

            <p>
              Fresh & Quality Eggs
            </p>

          </div>

        </div>


        <div class="visual-text">

          <p class="small-title">
            🥚 ADMIN PANEL
          </p>

          <h2>
            Kelola Armand Farm
            <br>
            dengan mudah.
          </h2>

          <p>
            Pantau pesanan, kelola produk,
            dan atur operasional toko.
          </p>

        </div>

        <div class="farm-decoration">

        </div>

      </div>

    </section>


    <!-- BAGIAN LOGIN -->

    <section class="login-section">

       <div class="login-card">

    <a
      href="../frontend/index.html"
      class="back-to-store"
    >
      ← Kembali ke Toko
    </a>

    <div class="login-header">

      <div class="mobile-logo">
        🥚
      </div>

      <h2>
        Selamat Datang 👋
      </h2>

      <p>
        Masuk ke dashboard admin
        Armand Farm
      </p>

    </div>

        <form id="login-form">

          <div class="form-group">

            <label for="email">
              Email Admin
            </label>

            <input
              type="email"
              id="email"
              placeholder="admin@example.com"
              required
            >

          </div>


          <div class="form-group">

            <label for="password">
              Password
            </label>

            <input
              type="password"
              id="password"
              placeholder="Masukkan password"
              required
            >

          </div>


          <p
            id="error-message"
            class="login-error"
          ></p>


          <button
            type="submit"
            id="login-button"
            class="login-button"S
          >

            Login
            <span>→</span>

          </button>

        </form>


        <div class="login-footer">

          <span>
            🛡️
          </span>

          <p>
            Akses khusus untuk admin
          </p>

        </div>

      </div>

    </section>

  </main>


  <script src="login.js"></script>

</body>

</html>
